<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#08090B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Training</title>

<style>
:root{
  --bg:#08090B; --surface:#121417; --surface-2:#1A1D22; --surface-3:#242830;
  --line:#2B3038; --line-soft:#1C2027;
  --text:#F2F5F9; --text-2:#98A2B3; --text-3:#5E6875;
  --lime:#C7FF3E; --cyan:#3ADCFF; --amber:#FFB13D; --red:#FF5A5A;
  --accent:var(--lime);
  --r:16px; --r-sm:11px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --tabh:calc(58px + var(--sab));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
input,textarea{background:none;border:0;outline:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- layout ---------- */
#app{min-height:100%;padding-top:var(--sat)}
.scroll{padding:0 16px calc(var(--tabh) + 24px);max-width:720px;margin:0 auto}
.wide .scroll{max-width:980px}

/* ---------- type ---------- */
h1{font-size:30px;line-height:1.1;letter-spacing:-.02em;font-weight:700;margin:0}
h2{font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);margin:28px 0 10px}
.sub{color:var(--text-2);font-size:14px;margin:4px 0 0}
.dim{color:var(--text-2)} .dim2{color:var(--text-3)}

/* ---------- top bar ---------- */
.top{padding:22px 0 4px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:600;
  color:var(--text-2);white-space:nowrap
}
.chip b{color:var(--accent);font-weight:700}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* ---------- cards ---------- */
.card{
  background:linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--line-soft);border-radius:var(--r);padding:18px;margin-bottom:12px
}
.card.flush{padding:0;overflow:hidden}

.hero{position:relative;overflow:hidden}
.hero::before{
  content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent),transparent 68%);
  pointer-events:none
}
.hero .kind{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.hero h3{font-size:27px;font-weight:700;letter-spacing:-.02em;margin:6px 0 0}
.hero .meta{color:var(--text-2);font-size:14px;margin-top:6px}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px;border-radius:13px;background:var(--accent);color:#0A0C08;
  font-weight:700;font-size:16px;letter-spacing:-.01em;margin-top:16px
}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--surface-3);color:var(--text);border:1px solid var(--line)}
.btn.slim{padding:12px;font-size:15px;margin-top:10px}

.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- pick list ---------- */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.pick{
  text-align:left;padding:14px;border-radius:var(--r-sm);background:var(--surface);
  border:1px solid var(--line-soft)
}
.pick .n{font-weight:650;font-size:15px;letter-spacing:-.01em}
.pick .d{font-size:12.5px;color:var(--text-3);margin-top:3px}
.pick:active{background:var(--surface-2)}
.bar{width:26px;height:3px;border-radius:2px;background:var(--accent);margin-bottom:10px;opacity:.9}

/* ---------- mobility ---------- */
.mob{display:flex;align-items:center;gap:14px;padding:16px 18px}
.tick{
  width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:2px solid var(--line);color:var(--text-3);transition:.15s
}
.tick.on{background:var(--amber);border-color:var(--amber);color:#170E00}
.streak{font-size:13px;color:var(--text-2)}
.streak b{color:var(--amber)}

/* ---------- session (fullscreen) ---------- */
.shead{
  position:sticky;top:0;z-index:20;padding:calc(var(--sat) + 12px) 16px 12px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line-soft)
}
.shead .t{font-size:19px;font-weight:700;letter-spacing:-.02em}
.shead .s{font-size:12.5px;color:var(--text-3);margin-top:2px}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);flex:none}
.prog{height:3px;border-radius:2px;background:var(--surface-3);margin-top:12px;overflow:hidden}
/* Backfilling an earlier day looks the same as logging live — this line is the
   only thing saying otherwise, so it has to be loud. */
.editing{
  margin-top:10px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--amber);display:flex;align-items:center;gap:7px
}
.editing i{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none}
.prog i{display:block;height:100%;background:var(--accent);transition:width .35s cubic-bezier(.4,0,.2,1)}

.ex{border:1px solid var(--line-soft);border-radius:var(--r);margin-bottom:12px;background:var(--surface);overflow:hidden}
.ex.active{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--surface-2)}
.ex.done{opacity:.55}
.exh{padding:15px 16px;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left}
.exh .nm{font-weight:650;font-size:16px;letter-spacing:-.01em}
.exh .tg{font-size:12.5px;color:var(--text-3);margin-top:3px}
.exh .last{font-size:12.5px;color:var(--text-2);margin-top:6px}
.exh .last b{color:var(--text);font-weight:600}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--surface-3);color:var(--text-2);letter-spacing:.04em;flex:none}
.pill.main{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.pill.ok{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}

.sets{padding:0 12px 12px}
.set{display:flex;align-items:center;gap:8px;padding:8px 4px;border-top:1px solid var(--line-soft)}
.set .ix{width:18px;font-size:13px;font-weight:700;color:var(--text-3);flex:none;text-align:center}
.set.on{background:color-mix(in srgb,var(--accent) 5%,transparent);border-radius:10px 10px 0 0;box-shadow:inset 2px 0 0 var(--accent)}
.set.ok .ix{color:var(--accent)}

.fld{
  flex:1;display:flex;align-items:baseline;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;min-width:0;height:48px;padding:0 11px
}
.ex.active .fld{background:var(--bg)}
.fld .v{flex:1;min-width:0;width:100%;text-align:right;font-size:18px;font-weight:650;align-self:center}
.fld .v::-webkit-outer-spin-button,.fld .v::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fld .v[type=number]{-moz-appearance:textfield}
.fld .v::placeholder{color:var(--text-3);font-weight:600}
.fld.sug .v{color:var(--text-2)}
.fld .u{font-size:11.5px;color:var(--text-3);font-weight:650;padding-left:6px;flex:none;align-self:center}

.chk{
  width:48px;height:48px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:var(--surface-3);border:1px solid var(--line);color:var(--text-3)
}
.set.on .chk{background:var(--accent);border-color:var(--accent);color:#0A0C08}
.set.ok .chk{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent)}

/* Steppers ride under the active set only — keeps the row itself uncluttered. */
.steps{
  display:flex;gap:6px;align-items:center;padding:0 4px 10px 26px;
  background:color-mix(in srgb,var(--accent) 5%,transparent);border-radius:0 0 10px 10px;
  box-shadow:inset 2px 0 0 var(--accent)
}
.steps button{
  flex:1;min-width:0;height:38px;border-radius:9px;background:var(--surface-3);
  border:1px solid var(--line);font-size:13.5px;font-weight:650;color:var(--text-2)
}
.steps button:active{background:var(--accent);color:#0A0C08;border-color:var(--accent)}
.steps .rpe{
  width:62px;flex:none;height:38px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface-3);text-align:center;font-size:14px;font-weight:650
}
.steps .rpe::placeholder{color:var(--text-3);font-size:12px}
.setnote{font-size:12.5px;color:var(--text-3);padding:8px 6px 2px;text-align:left}
.steps .notebtn{flex:none;width:44px;display:grid;place-items:center}
.steps .notebtn.has{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.setnotetext{
  font-size:13px;color:var(--text-2);padding:7px 10px 7px 26px;line-height:1.4;
  border-left:2px solid color-mix(in srgb,var(--accent) 45%,transparent);margin:0 4px 6px 8px
}
.exnote{
  font-size:13.5px;color:var(--text-2);line-height:1.45;padding:11px 13px;margin-top:10px;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;white-space:pre-wrap
}

.addex{width:100%;padding:14px;border-radius:var(--r);border:1px dashed var(--line);color:var(--text-2);font-weight:600;font-size:14.5px;margin-bottom:12px}
.addex:active{border-color:var(--accent);color:var(--accent)}

/* ---------- rest bar ---------- */
.rest{
  position:fixed;left:0;right:0;bottom:0;z-index:60;padding:12px 16px calc(12px + var(--sab));
  background:color-mix(in srgb,var(--surface-2) 94%,transparent);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);display:flex;align-items:center;gap:12px
}
.rest.done{background:color-mix(in srgb,var(--accent) 16%,var(--surface-2));border-top-color:var(--accent)}
.rest .tm{font-size:26px;font-weight:700;letter-spacing:-.03em;min-width:76px}
.rest .lb{font-size:11.5px;color:var(--text-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.rest button{padding:9px 12px;border-radius:9px;background:var(--surface-3);border:1px solid var(--line);font-size:13.5px;font-weight:650;color:var(--text-2)}
.rest .rp{position:absolute;left:0;top:-1px;height:2px;background:var(--accent);transition:width 1s linear}

/* ---------- cardio / forms ---------- */
.frow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.frow:last-child{border-bottom:0}
.frow label{font-size:14.5px;color:var(--text-2);flex:none}
.frow input{text-align:right;font-size:17px;font-weight:650;flex:1;min-width:0}
.frow .u{font-size:12px;color:var(--text-3);width:34px;text-align:left;flex:none}
textarea.note{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px;font-size:15px;resize:vertical;min-height:74px;margin-top:10px}

/* ---------- history ---------- */
.hitem{display:flex;gap:14px;padding:15px 16px;border:1px solid var(--line-soft);border-radius:var(--r-sm);background:var(--surface);margin-bottom:9px;width:100%;text-align:left;align-items:center}
.hitem .dt{width:44px;flex:none;text-align:center}
.hitem .dt .d{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1}
.hitem .dt .m{font-size:10.5px;color:var(--text-3);font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-top:3px}
.hitem .nm{font-weight:650;font-size:15.5px;letter-spacing:-.01em}
.hitem .sm{font-size:12.5px;color:var(--text-3);margin-top:3px}
.vline{width:1px;align-self:stretch;background:var(--line-soft)}

.det{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--surface);padding:16px;margin-bottom:12px}
.det .nm{font-weight:650;margin-bottom:9px}
.dset{display:flex;gap:10px;font-size:14px;padding:6px 0;border-top:1px solid var(--line-soft);align-items:baseline}
.dset .ix{width:18px;color:var(--text-3);font-size:12px;font-weight:700}
.dset .w{font-weight:650}

/* ---------- stats ---------- */
.seg{display:flex;gap:5px;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:4px;margin-top:16px;max-width:340px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:650;color:var(--text-3)}
.seg button.on{background:var(--surface-3);color:var(--text)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:10px;margin:14px 0 12px}
.tile{
  background:linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--line-soft);border-radius:var(--r);padding:14px 15px
}
.tile .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.tile .v{font-size:25px;font-weight:700;letter-spacing:-.025em;margin-top:6px}
.tile .v u{text-decoration:none;font-size:13px;font-weight:650;color:var(--text-3);margin-left:2px}
.tile .s{font-size:12.5px;color:var(--text-2);margin-top:3px}

/* Heatmap fills column-by-column, so 7 consecutive cells = one Sun–Sat week. */
.heatwrap{display:flex;gap:6px;align-items:stretch}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);grid-auto-columns:1fr;gap:3px;flex:1;min-width:0}
.heat i{display:block;aspect-ratio:1;border-radius:2.5px;background:var(--surface-3);opacity:.6}
.heat i.m{background:var(--amber);opacity:.5}
.heat i.s{background:var(--lime);opacity:1}
.heat i.c{background:var(--cyan);opacity:1}
.heat i.sc{background:linear-gradient(135deg,var(--lime) 0 50%,var(--cyan) 50% 100%);opacity:1}
.heat i.ahead{opacity:.16}
.hlab{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;width:13px;flex:none;font-size:8.5px;color:var(--text-3);font-weight:650}
.hlab span{display:grid;place-items:center}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:14px;font-size:12px;color:var(--text-3)}
.legend b{display:flex;align-items:center;gap:5px;font-weight:400}
.legend b i{width:9px;height:9px;border-radius:2px;display:block}

.chartwrap{max-width:620px}
.cols{display:flex;align-items:flex-end;gap:4px;height:116px;margin-top:8px}
.cols .col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.cols .col i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.cols .col.now i{opacity:.45}                        /* week still in progress — not a real decline */
.xax{display:flex;gap:4px;margin-top:7px;font-size:9.5px;color:var(--text-3)}
.xax span{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden}

.gbar{display:flex;align-items:center;gap:11px;padding:8px 0;width:100%;text-align:left}
.gbar+.gbar{border-top:1px solid var(--line-soft)}
.gbar .gn{width:100px;flex:none;font-size:13.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbar .gt{flex:1;min-width:0;height:9px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.gbar .gt i{display:block;height:100%;border-radius:5px}
.gbar .gv{width:78px;flex:none;text-align:right;font-size:13px;font-weight:650}
.gbar .gv u{text-decoration:none;color:var(--text-3);font-size:11.5px;font-weight:600}
.gbar.dim3{opacity:.4}

select.sel{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:13px 34px 13px 13px;font-size:15px;font-weight:650;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
  background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat
}
.pb{display:flex;align-items:baseline;gap:10px;padding:10px 0;font-size:14px}
.pb+.pb{border-top:1px solid var(--line-soft)}
.pb .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prtag{
  font-size:9.5px;font-weight:800;letter-spacing:.06em;color:#0A0C08;background:var(--accent);
  border-radius:5px;padding:3px 5px;flex:none;align-self:center
}
.foot{font-size:12px;color:var(--text-3);line-height:1.45;margin-top:14px}

/* ---------- equipment settings ---------- */
.gset{
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;width:100%;text-align:left;
  padding:12px 0;border-bottom:1px solid var(--line-soft)
}
.gset:last-of-type{border-bottom:0}
.gset .l{font-size:14.5px;color:var(--text-2);flex:none}
.gset .v{font-size:15.5px;font-weight:650;text-align:right;min-width:0}
/* On the exercise card the settings compete with the sets for attention, so
   they shrink to chips rather than rows. */
.gearstrip{display:flex;flex-wrap:wrap;gap:7px;padding:2px 0 12px}
.gearchip{
  display:inline-flex;align-items:baseline;gap:6px;padding:6px 10px;border-radius:9px;
  background:var(--surface);border:1px solid var(--line-soft);font-size:12.5px;color:var(--text-3)
}
.gearchip b{font-weight:650;color:var(--text-2)}

/* ---------- tabs ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  padding-bottom:var(--sab);background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(20px);border-top:1px solid var(--line-soft)
}
.tab{flex:1;padding:9px 0 7px;display:grid;place-items:center;gap:3px;color:var(--text-3);font-size:10.5px;font-weight:650;letter-spacing:.02em}
.tab.on{color:var(--accent)}

/* ---------- sheet / toast ---------- */
.mask{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:520px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:20px 18px calc(20px + var(--sab));
  animation:up .26s cubic-bezier(.2,.9,.3,1);
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch   /* a day with a lot on it still fits */
}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.sheet h4{margin:0 0 14px;font-size:18px;font-weight:700;letter-spacing:-.02em}
.sheet input[type=text],.sheet input[type=number],.sheet input[type=date]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px;font-size:16px}
.sheet input[type=date]{-webkit-appearance:none;appearance:none;min-height:48px}
/* The day list scrolls inside the sheet — the sheet itself never grows past the screen. */
.daylist{max-height:40vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:12px}
.daylist .hitem{padding:12px 13px}
.sheet .picks{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.opts{display:flex;gap:8px;margin-top:12px}
.opt{flex:1;padding:12px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-weight:650;font-size:14.5px;text-align:center}
.opt.on{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent);color:var(--accent)}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 18px);z-index:90;
  pointer-events:none;
  background:var(--surface-3);border:1px solid var(--line);padding:11px 17px;border-radius:11px;
  font-size:14px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.5);animation:up .2s
}
.empty{text-align:center;padding:52px 20px;color:var(--text-3);font-size:14.5px}

/* ---------- desktop ---------- */
@media (min-width:860px){

/* ==========================================================================
   Equipment settings — where the hardware goes for a given lift: rack holes,
   seat heights, machine pins. It is config, not history: it has no date, it
   changes rarely, and re-finding it costs a warm-up set every time. Stored as
   its own entry type in the same append-only log, so it syncs and merges like
   everything else.

   This is only the starting set — everything after is added in the app.
   ========================================================================== */
const GEAR_SEED = [
  {exerciseId:"bench-press", exerciseName:"Barbell Bench Press", label:"J-clips",      value:"Just under hole 17"},
  {exerciseId:"bench-press", exerciseName:"Barbell Bench Press", label:"Squatter bar", value:"Just under hole 9"}
];

/* Offered as suggestions when naming a setting — the rack and the machines
   have the same handful of adjustments over and over. */
const GEAR_LABELS = ["J-clips","Squatter bar","Safety pins","Bar height","Seat height","Back pad",
                     "Pin / stack","Foot plate","Handle position","Strap length","Bench angle"];

/* ==========================================================================
   Storage — IndexedDB. `entries` is an append-only log: every set, ride and
   mobility tick is one record with its own id and ts. Edits supersede by id,
   deletes are tombstones. That makes cross-device merging lossless later.
   ========================================================================== */
const DB = (() => {
  let db = null;
  let mode = "idb";
  const mem = {entries:{}, meta:{}};                    // last-resort in-memory store
  const KEY = s => "wt." + s;

  const openIDB = () => new Promise((res, rej) => {
    // Safari throws synchronously on opaque origins (file://), and can also
    // just never fire an event — so this races a timeout.
    if (!window.indexedDB) return rej(new Error("no indexedDB"));
    const r = indexedDB.open("wt", 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains("entries")) d.createObjectStore("entries", {keyPath:"id"});
      if (!d.objectStoreNames.contains("meta"))    d.createObjectStore("meta",    {keyPath:"k"});
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror   = () => rej(r.error || new Error("indexedDB blocked"));
    r.onblocked = () => rej(new Error("indexedDB blocked"));
    setTimeout(() => db || rej(new Error("indexedDB timed out")), 3000);
  });

  const lsOK = () => { try { localStorage.setItem("wt.probe","1"); localStorage.removeItem("wt.probe"); return true; } catch(e){ return false; } };
  const lsAll = s => { try { return JSON.parse(localStorage.getItem(KEY(s)) || "[]"); } catch(e){ return []; } };
  const lsPut = (s, v, key) => {
    const arr = lsAll(s), i = arr.findIndex(x => x[key] === v[key]);
    if (i >= 0) arr[i] = v; else arr.push(v);
    localStorage.setItem(KEY(s), JSON.stringify(arr));
  };

  const tx   = (store, m) => db.transaction(store, m).objectStore(store);
  const wrap = req => new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });

  return {
    /** Degrades IndexedDB -> localStorage -> memory rather than dying. */
    async open(){
      try { await openIDB(); mode = "idb"; }
      catch(e){ mode = lsOK() ? "ls" : "mem"; }
      return mode;
    },
    get mode(){ return mode; },
    async all(s){
      if (mode === "idb") return wrap(tx(s, "readonly").getAll());
      if (mode === "ls")  return lsAll(s);
      return Object.values(mem[s]);
    },
    async put(s, v){
      const key = s === "entries" ? "id" : "k";
      if (mode === "idb") return wrap(tx(s, "readwrite").put(v));
      if (mode === "ls")  return lsPut(s, v, key);
      mem[s][v[key]] = v;
    }
  };
})();

const S = {
  entries:[], meta:{}, view:"today", active:null, rest:null, sheet:null, detail:null, toast:null,
  stats:{range:"6w", exercise:null, group:null}
};

const uid   = () => "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const iso   = d => { const x = d || new Date(); return new Date(x.getTime() - x.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const today = () => iso();
const esc   = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num   = v => (v === "" || v == null || isNaN(+v)) ? null : +v;
/** A string safe to drop into an inline onclick="" as a JS argument. */
const jsArg = v => JSON.stringify(String(v ?? "")).replace(/"/g, "&quot;");

async function setMeta(k, v){ S.meta[k] = v; await DB.put("meta", {k, v}); }

async function saveEntry(e){
  const i = S.entries.findIndex(x => x.id === e.id);
  if (i >= 0) S.entries[i] = e; else S.entries.push(e);
  await DB.put("entries", e);
}

/* ==========================================================================
   Sync — a private GitHub repo holds log.json and is the source of truth
   across devices. The log being append-only is what makes this safe: merging
   two devices is a union keyed on entry id, with the newer ts winning, so
   nothing is ever lost to a race. A stale-sha rejection just means refetch
   and retry.

   The token lives in localStorage only. It is never written to the entry log,
   never exported, and never committed.
   ========================================================================== */
const GH_API = "https://api.github.com";

function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000)      // chunked: spread blows the stack on big logs
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(b64){
  const bin = atob(String(b64).replace(/\s/g, ""));    // GitHub wraps base64 in newlines
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/** Union by id; newer ts wins. Tombstones ride along like any other entry. */
function mergeEntries(a, b){
  const m = new Map();
  for (const e of a) if (e && e.id) m.set(e.id, e);
  for (const e of b){
    if (!e || !e.id) continue;
    const cur = m.get(e.id);
    if (!cur || (e.ts || 0) > (cur.ts || 0)) m.set(e.id, e);
  }
  return [...m.values()].sort((x, y) => (x.ts || 0) - (y.ts || 0));
}

const Sync = {
  state: {busy:false, last:null, error:null, pending:false},

  get cfg(){ try { return JSON.parse(localStorage.getItem("wt.sync") || "null"); } catch(e){ return null; } },
  set cfg(v){ try { v ? localStorage.setItem("wt.sync", JSON.stringify(v)) : localStorage.removeItem("wt.sync"); } catch(e){} },
  get on(){ const c = this.cfg; return !!(c && c.token && c.owner && c.repo); },

  async api(path, opts = {}){
    const c = this.cfg;
    if (!c) throw new Error("Not connected");
    const r = await fetch(GH_API + path, {
      ...opts,
      cache: "no-store",
      headers: {
        Accept: "application/vnd.github+json",
        Authorization: "Bearer " + c.token,
        "X-GitHub-Api-Version": "2022-11-28",
        ...(opts.body ? {"Content-Type": "application/json"} : {}),
        ...(opts.headers || {})
      }
    });
    return r;
  },

  async err(r){
    let d = "";
    try { d = (await r.json()).message || ""; } catch(e){}
    if (r.status === 401) return "Bad token — it may have expired or been revoked.";
    if (r.status === 403) return "Token lacks Contents: read and write on this repo.";
    if (r.status === 404) return "Repo not found, or the token can't see it.";
    return `GitHub ${r.status}${d ? " — " + d : ""}`;
  },

  async pull(){
    const c = this.cfg;
    const r = await this.api(`/repos/${c.owner}/${c.repo}/contents/${c.path}?ref=${c.branch}`);
    if (r.status === 404){
      // Ambiguous: log.json not created yet (fine, first sync) vs repo gone or
      // token revoked (not fine). Ask about the repo itself to tell them apart.
      const probe = await this.api(`/repos/${c.owner}/${c.repo}`);
      if (!probe.ok) throw new Error(await this.err(probe));
      return {entries: [], sha: null};
    }
    if (!r.ok) throw new Error(await this.err(r));
    const j = await r.json();
    let data;
    try { data = JSON.parse(b64dec(j.content)); }
    catch(e){ throw new Error("log.json in the repo isn't valid JSON"); }
    return {entries: Array.isArray(data) ? data : (data.entries || []), sha: j.sha};
  },

  async push(entries, sha, msg){
    const c = this.cfg;
    const body = {
      message: msg,
      content: b64enc(JSON.stringify({schema:1, updated:new Date().toISOString(), entries}, null, 2)),
      branch: c.branch
    };
    if (sha) body.sha = sha;
    const r = await this.api(`/repos/${c.owner}/${c.repo}/contents/${c.path}`, {method:"PUT", body:JSON.stringify(body)});
    if (r.status === 409 || r.status === 422) return {conflict:true};   // someone else moved the file
    if (!r.ok) throw new Error(await this.err(r));
    return {ok:true};
  },

  async run(reason){
    if (!this.on || this.state.busy) return;
    if (!navigator.onLine){ this.state.pending = true; renderSafe(); return; }

    this.state.busy = true; this.state.error = null; renderSafe();
    try{
      for (let attempt = 0; attempt < 3; attempt++){
        const {entries: remote, sha} = await this.pull();
        const merged = mergeEntries(S.entries, remote);

        // Adopt anything the remote knew that we didn't.
        const mine = new Map(S.entries.map(e => [e.id, e]));
        for (const e of merged){
          const cur = mine.get(e.id);
          if (!cur || (e.ts || 0) > (cur.ts || 0)) await saveEntry(e);
        }

        const rmap = new Map(remote.map(e => [e.id, e.ts || 0]));
        const same = merged.length === remote.length && merged.every(e => rmap.get(e.id) === (e.ts || 0));
        if (same){ this.state.pending = false; break; }

        const res = await this.push(merged, sha, `log: ${merged.length} entries (${reason || "sync"})`);
        if (res.conflict) continue;                                  // refetch and retry
        this.state.pending = false;
        break;
      }
      this.state.last = Date.now();
      await setMeta("lastSync", this.state.last);
    }catch(err){
      this.state.error = (err && err.message) || String(err);
      this.state.pending = true;
    }finally{
      this.state.busy = false;
      renderSafe();
    }
  }
};

/* Sync lands asynchronously; don't yank a field the user is typing in. */
function renderSafe(){
  const a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) return;
  render();
}

/* Batched — one commit per session beats one per set. */
let _syncT = null;
function syncSoon(reason, delay = 30000){
  if (!Sync.on) return;
  clearTimeout(_syncT);
  _syncT = setTimeout(() => Sync.run(reason), delay);
}

window.addEventListener("online", () => Sync.run("back online"));

/* ---------- derived ---------- */
function blockInfo(on){
  const b = S.meta.block || {block:"A", start:today()};
  const wk = Math.floor((new Date((on || today())+"T00:00:00") - new Date(b.start+"T00:00:00")) / 6048e5) + 1;
  return {block:b.block, start:b.start, week:Math.max(1, wk)};
}
const target = (ex, blk) => ex[blk] || ex.A;
const sets   = () => S.entries.filter(e => e.type === "set" && !e.deleted);

/* Distance is km. Entries written before the switch used `distanceMi`; those
   numbers are read as-is rather than converted — they were typed as km into a
   mislabelled field. */
const distKm = e => e.distanceKm ?? e.distanceMi ?? null;

/** Free-text note attached to one exercise within one session. */
const exNote = (date, sessionId, exerciseId) => {
  const e = S.entries.find(x => x.id === `exnote-${date}-${sessionId}-${exerciseId}` && !x.deleted);
  return e ? e.text : "";
};

/* ---------- equipment settings ----------
   Keyed on exercise + label, so saving the same setting twice corrects it
   rather than stacking a second copy. `created` fixes the display order; `ts`
   is left free to move on every write, which is what the merge sorts on. */
const slugify = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const gearId  = (exerciseId, label) => `gear-${exerciseId}-${slugify(label)}`;
const gearAll = () => S.entries.filter(e => e.type === "gear" && !e.deleted);
const byCreated = (a, b) => (a.created || a.ts || 0) - (b.created || b.ts || 0);

/** Settings for one exercise, in the order they were added. */
const gearFor = exerciseId => gearAll().filter(e => e.exerciseId === exerciseId).sort(byCreated);

/** Every exercise carrying settings, routine order first, then the rest. */
function gearList(){
  const order = [...knownExercises().keys()];
  const m = new Map();
  for (const e of gearAll().sort(byCreated)){
    if (!m.has(e.exerciseId)) m.set(e.exerciseId, {id:e.exerciseId, name:e.exerciseName || e.exerciseId, items:[]});
    m.get(e.exerciseId).items.push(e);
  }
  const rank = id => { const i = order.indexOf(id); return i < 0 ? 1e6 : i; };
  return [...m.values()].sort((a, b) => rank(a.id) - rank(b.id) || (a.name < b.name ? -1 : 1));
}

/* Seeded once, and only when the log holds no equipment entry at all —
   tombstones included. A device that has already synced has the real set by
   then, so this can never resurrect something deleted on another phone. */
async function seedGear(){
  if (S.meta.gearSeeded) return;
  await setMeta("gearSeeded", true);
  if (S.entries.some(e => e.type === "gear")) return;
  const ts = Date.now();
  for (let i = 0; i < GEAR_SEED.length; i++){
    const g = GEAR_SEED[i];
    await saveEntry({id:gearId(g.exerciseId, g.label), ts:ts + i, created:ts + i, type:"gear", ...g});
  }
  syncSoon("equipment", 8000);
  renderSafe();
}

/** Most recent session's sets for an exercise, strictly before `beforeDate`. */
function lastPerf(exerciseId, beforeDate){
  const rows = sets().filter(e => e.exerciseId === exerciseId && e.date < beforeDate);
  if (!rows.length) return null;
  const d = rows.reduce((m, e) => e.date > m ? e.date : m, "");
  return {date:d, sets:rows.filter(e => e.date === d).sort((a,b) => a.setIndex - b.setIndex)};
}

function mobilityStreak(){
  const done = new Set(S.entries.filter(e => e.type === "mobility" && !e.deleted).map(e => e.date));
  let n = 0, d = new Date();
  if (!done.has(iso(d))) d.setDate(d.getDate() - 1);   // today not yet ticked doesn't break it
  while (done.has(iso(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/** All logged sessions, newest first. */
function sessionList(){
  const map = new Map();
  for (const e of S.entries){
    if (e.deleted || e.type === "mobility" || e.type === "gear") continue;
    const key = e.date + "|" + e.sessionId;
    if (!map.has(key)) map.set(key, {date:e.date, sessionId:e.sessionId, sessionName:e.sessionName, entries:[]});
    map.get(key).entries.push(e);
  }
  // Type comes from the contents, not from whichever entry happened to be first.
  const out = [...map.values()].map(s => ({...s, type: s.entries.some(e => e.type === "cardio") ? "cardio" : "strength"}));
  return out.filter(s => s.entries.some(e => e.type === "set" || e.type === "cardio"))
            .sort((a,b) => b.date < a.date ? -1 : 1);
}

const knownExercises = () => {
  const m = new Map();
  Object.values(ROUTINE.sessions).forEach(s => (s.exercises||[]).forEach(e => m.set(e.id, e.name)));
  sets().forEach(e => m.set(e.exerciseId, e.exerciseName));
  return m;
};

/* ==========================================================================
   Metrics
   ========================================================================== */

/* Epley. The point isn't the number's accuracy — it's that it puts a 4×5 in
   Block A and a 4×12 in Block B on one axis, which raw weight can't do.
   Bodyweight work (weight 0) has no e1RM; those lifts chart reps instead. */
const e1rm = (w, r) => (w > 0 && r > 0) ? w * (1 + r/30) : 0;

const GROUPS = {
  quads:"Quads", posterior:"Posterior", push:"Push", pull:"Pull",
  arms:"Arms", core:"Core", calves:"Calves", other:"Other"
};
const GROUP_COLOR = {
  quads:"var(--lime)", posterior:"var(--cyan)", push:"var(--amber)", pull:"#A78BFA",
  arms:"#FF7BC2", core:"#4ADE9B", calves:"#6EA8FF", other:"var(--text-3)"
};

/* Anything logged ad-hoc isn't in ROUTINE, so fall back to the name. First
   match wins — order matters ("leg extension" is quads, not arms). */
const GROUP_HINTS = [
  [/calf|calves/,                                            "calves"],
  [/nordic|leg curl|ham(string)? curl/,                      "posterior"],  // "curl" that isn't a biceps curl
  [/rear delt|reverse fly|rear fly/,                         "pull"],       // "fly" that isn't a chest fly
  [/pallof/,                                                 "core"],       // "press" that isn't a press
  [/squat|lunge|step.?up|leg press|leg extension|split|sled/, "quads"],
  [/deadlift|rdl|romanian|hip thrust|glute|hamstring|swing|good.?morning|hyperext|pull.?through|back ext/, "posterior"],
  [/bench|chest|fly|dip|push.?up|press|ohp|lateral raise/,   "push"],
  [/pull.?up|chin.?up|row|pulldown|face pull|lat |shrug|rear delt/, "pull"],
  [/curl|tricep|pushdown|skull|kickback/,                    "arms"],
  [/plank|pallof|dead.?bug|bird.?dog|crunch|hollow|ab |carry|core|oblique|sit.?up/, "core"]
];
const ROUTINE_GROUPS = (() => {
  const m = new Map();
  Object.values(ROUTINE.sessions).forEach(s => (s.exercises||[]).forEach(e => e.group && m.set(e.id, e.group)));
  return m;
})();
function groupOf(exerciseId, exerciseName){
  const known = ROUTINE_GROUPS.get(exerciseId);
  if (known) return known;
  const s = String(exerciseName || exerciseId || "").toLowerCase().replace(/-/g," ");
  for (const [re, g] of GROUP_HINTS) if (re.test(s)) return g;
  return "other";
}

/* Weeks run Sunday–Saturday, matching ROUTINE.week and the heatmap columns. */
function weekStart(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() - d.getDay());
  return iso(d);
}
const shiftDate = (dateStr, days) => {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return iso(d);
};

const RANGES = {"6w":{days:42, label:"6 weeks"}, "6m":{days:182, label:"6 months"}, all:{days:null, label:"all time"}};

/** Inclusive start date of the current range — for `all`, the first thing logged. */
function rangeStart(){
  const r = RANGES[S.stats.range] || RANGES["6w"];
  if (r.days) return shiftDate(today(), -(r.days - 1));
  const dates = S.entries.filter(e => !e.deleted && e.date).map(e => e.date);
  return dates.length ? dates.reduce((m, d) => d < m ? d : m) : today();
}

/** Sunday of each week in the window, oldest first. Capped so bars stay legible. */
function weeksIn(from, cap = 26){
  const out = [];
  let w = weekStart(today());
  while (w >= weekStart(from) && out.length < cap){ out.unshift(w); w = shiftDate(w, -7); }
  return out;
}

/** Best single set by e1RM for an exercise, all time. `skipId` ignores one entry. */
function bestSet(exerciseId, skipId){
  let best = null;
  for (const e of sets()){
    if (e.exerciseId !== exerciseId || e.id === skipId) continue;
    const v = e1rm(e.weight, e.reps);
    if (v > 0 && (!best || v > best.v)) best = {v, e};
  }
  return best;
}

/** Entry ids that are the current all-time best for their exercise. */
function prIds(exerciseIds){
  const out = new Set();
  for (const id of exerciseIds){ const b = bestSet(id); if (b) out.add(b.e.id); }
  return out;
}

/** Per-session bests for one exercise, oldest first — the progression series. */
function progression(exerciseId){
  const rows = sets().filter(e => e.exerciseId === exerciseId);
  const byDate = new Map();
  for (const e of rows){
    const cur = byDate.get(e.date) || {date:e.date, e1:0, weight:0, reps:0, volume:0, sets:0, top:null};
    const v = e1rm(e.weight, e.reps);
    if (v > cur.e1){ cur.e1 = v; cur.weight = e.weight; cur.reps = e.reps; cur.top = e; }
    cur.volume += (e.reps || 0) * (e.weight || 0);
    cur.reps_total = (cur.reps_total || 0) + (e.reps || 0);
    cur.sets++;
    byDate.set(e.date, cur);
  }
  return [...byDate.values()].sort((a,b) => a.date < b.date ? -1 : 1);
}

/* ==========================================================================
   Session flow
   ========================================================================== */
/** `logged` are that exercise's already-saved set entries, if any — they come
    back as ticked rows wired to their entry id, so re-logging edits in place. */
function buildExercise(ex, blk, date, logged){
  const t = target(ex, blk), last = lastPerf(ex.id, date);
  const rows = (logged || []).slice().sort((a,b) => a.setIndex - b.setIndex);
  const n = Math.max(t.sets, rows.length ? rows[rows.length-1].setIndex : 0);
  return {
    ...ex, target:t, last,
    sets: Array.from({length:n}, (_, i) => {
      const e = rows.find(r => r.setIndex === i + 1);
      if (e) return {
        reps:e.reps, weight:e.weight, rpe:e.rpe ?? null, notes:e.notes || "",
        done:true, suggested:false, entryId:e.id
      };
      const ls = last && last.sets[i];
      return {
        reps:   ls ? ls.reps   : t.lo,
        weight: ls ? ls.weight : (ex.bodyweight ? 0 : null),
        rpe:null, notes:"", done:false, suggested:!!ls, entryId:null   // notes never carry over
      };
    })
  };
}

/** Opens a session for any date, live or backfilled, empty or already logged.
    Everything saved for that day is rehydrated, so editing and logging fresh
    are the same screen — there is no separate edit mode to keep in step. */
function startSession(id, date){
  const d = date || today();
  // Resume rather than rebuild — a rebuild would throw away unlogged input.
  if (S.active && S.active.sessionId === id && S.active.date === d){
    if (d === today()) reqWake();
    return go("session");
  }
  const def = ROUTINE.sessions[id] || {};
  const rows = S.entries.filter(e => !e.deleted && e.date === d && e.sessionId === id);
  const cardioEntry = rows.find(e => e.type === "cardio");
  const kind = def.kind || (cardioEntry ? "cardio" : "strength");

  const byEx = new Map();
  for (const e of rows.filter(x => x.type === "set")){
    if (!byEx.has(e.exerciseId)) byEx.set(e.exerciseId, []);
    byEx.get(e.exerciseId).push(e);
  }
  // What the block was when it was logged beats what the block is now.
  const blk = (rows.find(e => e.block) || {}).block || blockInfo(d).block;

  const exercises = (def.exercises || []).map(ex => buildExercise(ex, blk, d, byEx.get(ex.id)));
  const inRoutine = new Set((def.exercises || []).map(ex => ex.id));
  for (const [exId, logged] of byEx){                    // substitutions and one-offs
    if (inRoutine.has(exId)) continue;
    const reps = logged[0].reps || 10;
    exercises.push(buildExercise(
      {id:exId, name:logged[0].exerciseName || exId, A:{sets:logged.length,lo:reps,hi:reps}, B:{sets:logged.length,lo:reps,hi:reps}},
      blk, d, logged));
  }

  const open = exercises.findIndex(e => !e.sets.every(s => s.done));
  S.active = {
    sessionId:id, sessionName:def.name || (rows[0] && rows[0].sessionName) || id, kind,
    date:d, block:blk, startedAt:Date.now(),
    exercises: kind === "cardio" ? [] : exercises,
    cardio: kind === "cardio" ? {
      durationMin: cardioEntry ? cardioEntry.durationMin ?? null : null,
      distanceKm:  cardioEntry ? distKm(cardioEntry) : null,
      avgPower:    cardioEntry ? cardioEntry.avgPower ?? null : null,
      avgHr:       cardioEntry ? cardioEntry.avgHr ?? null : null,
      rpe:         cardioEntry ? cardioEntry.rpe ?? null : null,
      notes:       cardioEntry ? cardioEntry.notes || "" : ""
    } : null,
    cardioId: cardioEntry ? cardioEntry.id : null,
    cur: open >= 0 ? open : (exercises.length ? -1 : 0)   // all done: start collapsed
  };
  if (d === today()) reqWake();
  persistActive(); go("session");
}

/** From history or the day sheet — same screen, just already populated. */
function editSession(date, sid){ S.sheet = null; startSession(sid, date); }

/* Debounced — oninput fires per keystroke and IDB writes are not free. */
let _pt = null;
function persistActive(){ clearTimeout(_pt); _pt = setTimeout(() => setMeta("active", S.active), 400); }

function restFor(ex){
  const b = REST[S.active.block] || REST.A;
  return ex.main ? b.main : b.acc;
}

async function logSet(ei, si){
  const ex = S.active.exercises[ei], st = ex.sets[si];
  if (st.weight == null && !ex.bodyweight) return toast("Enter a weight first");
  if (st.reps == null)                     return toast("Enter reps first");

  const id = st.entryId || uid();
  await saveEntry({
    id, ts:Date.now(), type:"set",
    date:S.active.date, sessionId:S.active.sessionId, sessionName:S.active.sessionName,
    block:S.active.block, exerciseId:ex.id, exerciseName:ex.name, setIndex:si + 1,
    reps:st.reps, weight:st.weight, unit:"lb", rpe:st.rpe, notes:st.notes || "", deleted:false
  });
  st.done = true; st.entryId = id; st.suggested = false;

  // A best is judged against every other set of this lift — re-logging the same
  // set shouldn't have it beat itself.
  const v = e1rm(st.weight, st.reps), prev = bestSet(ex.id, id);
  if (v > 0 && (!prev || v > prev.v + 0.05)) toast(`New best — ${fmtW(st.weight)} × ${st.reps}`);

  // Advance to the next unfinished exercise once this one is complete.
  if (ex.sets.every(x => x.done)){
    const nxt = S.active.exercises.findIndex((e, i) => i > ei && !e.sets.every(x => x.done));
    if (nxt >= 0) S.active.cur = nxt;
  }
  // No rest timer when you're filling in a day that's already over.
  if (S.active.date === today()) startRest(restFor(ex));
  setMeta("active", S.active); syncSoon("mid-session"); render();
}

/** Retyping a number on a set that's already logged rewrites its entry in place
    — same id, so it supersedes on every device rather than forking. Fires on
    blur, and deliberately doesn't re-render: that would yank focus mid-edit,
    so the confirmation is a border flash on the field itself. */
async function commitSet(st){
  if (!st || !st.done || !st.entryId) return false;
  const e = S.entries.find(x => x.id === st.entryId);
  if (!e) return false;
  if (e.reps === st.reps && e.weight === st.weight && (e.rpe ?? null) === (st.rpe ?? null)) return false;
  await saveEntry({...e, reps:st.reps, weight:st.weight, rpe:st.rpe ?? null, ts:Date.now()});
  syncSoon("edit set", 8000);
  return true;
}

async function commitEdit(ei, si, el){
  const a = S.active;
  if (!a || !a.exercises[ei]) return;
  if (!await commitSet(a.exercises[ei].sets[si])) return;
  const f = el && el.closest && el.closest(".fld, .steps");
  if (f){ f.style.borderColor = "var(--accent)"; setTimeout(() => { f.style.borderColor = ""; }, 900); }
}

/** Sweep on the way out — a re-render can replace an input before its blur
    fires, and the typed value is only in state at that point. Works off a
    snapshot, so the caller is free to drop S.active without waiting. */
async function commitAll(){
  const a = S.active;
  if (!a) return;
  for (const ex of a.exercises) for (const st of ex.sets) await commitSet(st);
}

async function unlogSet(ei, si){
  const st = S.active.exercises[ei].sets[si];
  if (st.entryId){
    const e = S.entries.find(x => x.id === st.entryId);
    if (e) await saveEntry({...e, deleted:true, ts:Date.now()});
  }
  st.done = false; st.entryId = null;
  persistActive(); render();
}

async function finishSession(){
  const a = S.active, past = a.date !== today();
  await commitAll();
  if (a.kind === "cardio"){
    const c = a.cardio;
    if (c.durationMin == null) return toast("Add a duration");
    await saveEntry({
      // Reuse the id already on file so an edit supersedes rather than duplicates.
      id: a.cardioId || `cardio-${a.date}-${a.sessionId}`, ts:Date.now(), type:"cardio",
      date:a.date, sessionId:a.sessionId, sessionName:a.sessionName,
      ...c, deleted:false
    });
  }
  const {sessionName:name, date, sessionId} = a;
  S.active = null; S.rest = null;
  await setMeta("active", null); await setMeta("rest", null);
  releaseWake();
  // A backfill came from history — put them back where they were, not on Today.
  if (past){ openDetail(date, sessionId); toast("Session saved"); }
  else { go("today"); toast("Session saved"); }
  clearTimeout(_syncT); Sync.run("after " + name);
}

async function toggleMobility(date){
  const id = "mob-" + date, cur = S.entries.find(e => e.id === id);
  await saveEntry({id, ts:Date.now(), type:"mobility", date, deleted:cur ? !cur.deleted : false});
  syncSoon("mobility", 8000); render();
}

/* ==========================================================================
   Rest timer — stores an absolute end time, so backgrounding or reloading
   never drifts it. iOS freezes JS timers when the app isn't foregrounded;
   recomputing from Date.now() sidesteps that entirely.
   ========================================================================== */
function startRest(sec){ S.rest = {endsAt:Date.now() + sec*1000, dur:sec, rang:false}; setMeta("rest", S.rest); }
function adjustRest(d){ if (S.rest){ S.rest.endsAt += d*1000; S.rest.dur += d; setMeta("rest", S.rest); paintRest(); } }
function skipRest(){ S.rest = null; setMeta("rest", null); render(); }
const restLeft = () => S.rest ? Math.round((S.rest.endsAt - Date.now())/1000) : 0;

setInterval(() => {
  if (!S.rest) return;
  const left = restLeft();
  if (left <= 0 && !S.rest.rang){ S.rest.rang = true; beep(); }
  if (left <= -30) { S.rest = null; setMeta("rest", null); render(); return; }
  paintRest();
}, 1000);

function paintRest(){
  const el = document.getElementById("restbar"); if (!el) return;
  const left = restLeft(), over = left <= 0, a = Math.abs(left);
  el.classList.toggle("done", over);
  el.querySelector(".tm").textContent = (over && left < 0 ? "+" : "") + Math.floor(a/60) + ":" + String(a%60).padStart(2,"0");
  el.querySelector(".lb").textContent = over ? "Ready" : "Rest";
  el.querySelector(".rp").style.width = over ? "100%" : (100 - left/S.rest.dur*100) + "%";
}

let actx = null;
function beep(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    [0, .18, .36].forEach((t, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), at = actx.currentTime + t;
      o.frequency.value = i === 2 ? 1046 : 784; o.type = "sine";
      g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.22, at + .02);
      g.gain.exponentialRampToValueAtTime(.001, at + .15);
      o.connect(g); g.connect(actx.destination); o.start(at); o.stop(at + .16);
    });
  }catch(e){}
  if (navigator.vibrate) navigator.vibrate([90, 60, 90]);
}

/* Screen wake lock — keeps the phone awake mid-session so the timer stays visible. */
let wake = null;
async function reqWake(){ try{ if ("wakeLock" in navigator && !wake) wake = await navigator.wakeLock.request("screen"); }catch(e){} }
function releaseWake(){ try{ wake && wake.release(); }catch(e){} wake = null; }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible"){ if (S.active) reqWake(); render(); Sync.run("foreground"); }
  else { wake = null; if (Sync.on) { clearTimeout(_syncT); Sync.run("backgrounded"); } }
});

/* ==========================================================================
   Views
   ========================================================================== */
const go = v => { S.view = v; S.detail = null; window.scrollTo(0,0); render(); };
/* The dismissal re-renders, which would blow away whatever is half-typed in a
   sheet — save a setting, open the next one, and your typing vanishes two
   seconds later. So when a field has focus the toast is lifted out of the DOM
   directly instead. */
function toast(msg){
  S.toast = msg; render();
  clearTimeout(toast._t);
  const clear = () => {
    S.toast = null;
    const el = document.querySelector(".toast"), a = document.activeElement;
    // Focused field: pull the node out by hand rather than re-rendering over it.
    if (el && a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) el.remove();
    else render();
  };
  toast._t = setTimeout(clear, 2000);
}

/* ---------- Session ---------- */
function viewSession(){
  const a = S.active;
  if (!a) { S.view = "today"; return viewToday(); }
  if (a.kind === "cardio") return viewCardio();

  const total = a.exercises.reduce((n,e) => n + e.sets.length, 0);
  const done  = a.exercises.reduce((n,e) => n + e.sets.filter(s => s.done).length, 0);
  const mins  = Math.floor((Date.now() - a.startedAt)/6e4);
  const past  = a.date !== today();

  return `<div class="shead">
      <div class="between">
        <div class="grow">
          <div class="t">${esc(a.sessionName)}</div>
          <div class="s">Block ${a.block} · ${done}/${total} sets${past ? "" : ` · ${mins} min`}</div>
        </div>
        <button class="iconbtn" onclick="closeSession()">${ICON.x}</button>
      </div>
      <div class="prog"><i style="width:${total?done/total*100:0}%"></i></div>
      ${past ? `<div class="editing"><i></i>Logging to ${esc(dayLabelLong(a.date))}</div>` : ""}
    </div>
    <div class="scroll" style="padding-top:14px;padding-bottom:${S.rest?"140px":"40px"}">
      ${(prs => a.exercises.map((e,i) => exCard(e,i,prs)).join(""))(prIds(a.exercises.map(e => e.id)))}
      ${quickAdds()}
      <button class="addex" onclick="sheetAddExercise()">+  Add exercise</button>
      <button class="btn ghost" onclick="finishSession()">${past ? "Done" : "Finish session"}</button>
    </div>`;
}

function exCard(ex, i, prs){
  const a = S.active, allDone = ex.sets.every(s => s.done), open = a.cur === i;
  const note = exNote(a.date, a.sessionId, ex.id);
  const gear = gearFor(ex.id);
  const t = ex.target;
  const reps = t.lo === t.hi ? t.lo : `${t.lo}–${t.hi}`;
  const lastTxt = ex.last
    ? `<div class="last">Last ${fmtDay(ex.last.date)} · <b>${ex.last.sets.map(s => `${fmtW(s.weight)}×${s.reps}`).join(", ")}</b></div>`
    : `<div class="last dim2">No history yet</div>`;

  return `<div class="ex ${open?"active":""} ${allDone&&!open?"done":""}">
    <button class="exh" onclick="focusEx(${i})">
      <div class="grow">
        <div class="nm">${esc(ex.name)}</div>
        <div class="tg">${t.sets} × ${reps}${ex.perSide?" / side":""}${ex.optional?" · optional":""}</div>
        ${lastTxt}
        ${open && ex.note ? `<div class="last dim2" style="margin-top:8px">${esc(ex.note)}</div>` : ""}
      </div>
      ${allDone ? `<span class="pill ok">DONE</span>` : ex.main ? `<span class="pill main">MAIN</span>` : ""}
    </button>
    ${open ? `<div class="sets">
       ${gearStrip(ex.id, ex.name)}
       ${ex.sets.map((s,j) => setRow(ex,i,s,j,prs)).join("")}
       <div class="row" style="gap:10px;padding-top:8px">
         <button class="setnote" onclick="addSet(${i})" style="flex:1;color:var(--text-3)">+ add a set</button>
         <button class="setnote" onclick="sheetNote('ex',${i})" style="flex:none;color:${note?"var(--accent)":"var(--text-3)"}">
           ${note ? "Edit note" : "+ note"}
         </button>
       </div>
       ${note ? `<div class="exnote" onclick="sheetNote('ex',${i})">${esc(note)}</div>` : ""}
     </div>` : ""}
    ${!open && note ? `<div class="exnote" style="margin:0 16px 14px">${esc(note)}</div>` : ""}
  </div>`;
}

function setRow(ex, i, st, j, prs){
  const next = !st.done && ex.sets.findIndex(x => !x.done) === j;
  const gh = ex.last && ex.last.sets[j];
  const sug = st.suggested && !st.done ? "sug" : "";
  const pr  = st.entryId && prs && prs.has(st.entryId);
  return `<div class="set ${st.done?"ok":""} ${next?"on":""}">
    <div class="ix num">${j+1}</div>
    ${ex.bodyweight ? "" : `
    <div class="fld ${sug}">
      <input class="v num" type="number" inputmode="decimal" step="0.5" value="${st.weight ?? ""}"
             placeholder="${gh ? fmtW(gh.weight) : "—"}" onfocus="this.select()"
             oninput="setVal(${i},${j},'weight',this.value)"
             onchange="commitEdit(${i},${j},this)"><span class="u">lb</span>
    </div>`}
    <div class="fld ${sug}">
      <input class="v num" type="number" inputmode="numeric" value="${st.reps ?? ""}"
             placeholder="${gh ? gh.reps : "—"}" onfocus="this.select()"
             oninput="setVal(${i},${j},'reps',this.value)"
             onchange="commitEdit(${i},${j},this)"><span class="u">${ex.perSide?"ea":"reps"}</span>
    </div>
    ${pr ? `<span class="prtag" title="Best estimated 1RM for this lift">PR</span>` : ""}
    <button class="chk" onclick="${st.done?`unlogSet(${i},${j})`:`logSet(${i},${j})`}">${ICON.check}</button>
  </div>
  ${next ? `<div class="steps">
    ${ex.bodyweight ? "" : `<button onclick="bump(${i},${j},'weight',-5)">−5 lb</button>
    <button onclick="bump(${i},${j},'weight',5)">+5 lb</button>`}
    <button onclick="bump(${i},${j},'reps',-1)">−1</button>
    <button onclick="bump(${i},${j},'reps',1)">+1</button>
    <input class="rpe num" type="number" inputmode="decimal" step="0.5" min="1" max="10"
           value="${st.rpe ?? ""}" placeholder="RPE" onfocus="this.select()"
           oninput="setVal(${i},${j},'rpe',this.value)" onchange="commitEdit(${i},${j},this)">
    <button class="notebtn ${st.notes?"has":""}" onclick="sheetNote('set',${i},${j})" title="Note">${ICON.note}</button>
  </div>` : ""}
  ${st.notes ? `<div class="setnotetext" onclick="sheetNote('set',${i},${j})">${esc(st.notes)}</div>` : ""}`;
}

/* Exercises you've logged for this session before but that aren't in today's
   list — substitutions you actually made, one tap to bring back. */
function quickAdds(){
  const a = S.active, present = new Set(a.exercises.map(e => e.id));
  const seen = new Map();
  sets().filter(e => e.sessionId === a.sessionId && !present.has(e.exerciseId) && e.date < a.date)
        .forEach(e => {
          const cur = seen.get(e.exerciseId);
          if (!cur || e.date > cur.date) seen.set(e.exerciseId, {name:e.exerciseName, date:e.date});
        });
  const list = [...seen.entries()].sort((x,y) => y[1].date < x[1].date ? -1 : 1).slice(0, 6);
  if (!list.length) return "";
  return `<div style="margin-bottom:12px">
    <div style="font-size:12px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin-bottom:9px">Also logged here before</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      ${list.map(([id, v]) => `<button class="chip" onclick="quickAdd('${id}',${JSON.stringify(v.name).replace(/"/g,"&quot;")})">+ ${esc(v.name)}</button>`).join("")}
    </div></div>`;
}

/* Notes. Exercise-level notes are their own entry type keyed by
   date+session+exercise, so they merge across devices like everything else.
   Set-level notes live on the set entry itself. */
function sheetNote(kind, i, j){
  const a = S.active, ex = a.exercises[i];
  const cur = kind === "ex" ? exNote(a.date, a.sessionId, ex.id) : (ex.sets[j].notes || "");
  const title = kind === "ex" ? ex.name : `${ex.name} · set ${j+1}`;
  S.sheet = () => `<div class="mask" onclick="if(event.target===this){S.sheet=null;render()}">
    <div class="sheet">
      <h4 class="trunc">${esc(title)}</h4>
      <textarea class="note" id="note-text" rows="4" placeholder="${kind==="ex"
        ? "How it felt, form cues, niggles…" : "e.g. failed at 6, belt on"}">${esc(cur)}</textarea>
      <button class="btn" onclick="saveNote('${kind}',${i},${j ?? -1})">Save</button>
      ${cur ? `<button class="btn ghost slim" onclick="saveNote('${kind}',${i},${j ?? -1},true)">Clear note</button>` : ""}
      <button class="btn ghost slim" onclick="S.sheet=null;render()">Cancel</button>
    </div></div>`;
  render();
  setTimeout(() => { const t = document.getElementById("note-text"); if (t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }, 60);
}

async function saveNote(kind, i, j, clear){
  const a = S.active, ex = a.exercises[i];
  const text = clear ? "" : (document.getElementById("note-text").value || "").trim();
  S.sheet = null;

  if (kind === "ex"){
    await saveEntry({
      id:`exnote-${a.date}-${a.sessionId}-${ex.id}`, ts:Date.now(), type:"exnote",
      date:a.date, sessionId:a.sessionId, sessionName:a.sessionName,
      exerciseId:ex.id, exerciseName:ex.name, text, deleted:!text
    });
  } else {
    const st = ex.sets[j];
    st.notes = text;
    // If the set is already logged, push the note onto its existing entry.
    if (st.entryId){
      const e = S.entries.find(x => x.id === st.entryId);
      if (e) await saveEntry({...e, notes:text, ts:Date.now()});
    }
    persistActive();
  }
  syncSoon("note", 8000);
  render();
}

/* ---------- equipment settings ---------- */

/* Setup is read at the rack, mid-warm-up — so it sits on the exercise itself
   while you're logging it, not only on its own screen. */
function gearStrip(exerciseId, exerciseName){
  const items = gearFor(exerciseId), arg = `'${exerciseId}',${jsArg(exerciseName)}`;
  return `<div class="gearstrip">
    ${items.map(g => `<button class="gearchip" onclick="sheetGear(${arg},'${g.id}')">
       ${esc(g.label)} <b>${esc(g.value)}</b></button>`).join("")}
    <button class="gearchip" onclick="sheetGear(${arg})">${items.length ? "+" : "+ setup"}</button>
  </div>`;
}

function sheetGear(exerciseId, exerciseName, id){
  const cur = id ? S.entries.find(x => x.id === id && !x.deleted) : null;
  S.sheet = () => `<div class="mask" onclick="if(event.target===this){S.sheet=null;render()}">
    <div class="sheet">
      <h4 class="trunc">${esc(exerciseName)}${cur ? "" : " · setup"}</h4>
      <input type="text" id="gear-label" list="gearlabels" placeholder="What's set — J-clips, seat height…"
             value="${esc(cur ? cur.label : "")}" autocomplete="off" autocapitalize="words">
      <datalist id="gearlabels">${GEAR_LABELS.map(l => `<option value="${esc(l)}">`).join("")}</datalist>
      <input type="text" id="gear-value" placeholder="Where it goes — just under hole 17"
             value="${esc(cur ? cur.value : "")}" autocomplete="off" style="margin-top:10px">
      <button class="btn" onclick="saveGear('${exerciseId}',${jsArg(exerciseName)}${cur ? `,'${cur.id}'` : ""})">Save</button>
      ${cur ? `<button class="btn ghost slim" onclick="deleteGear('${cur.id}')">Delete</button>` : ""}
      <button class="btn ghost slim" onclick="S.sheet=null;render()">Cancel</button>
    </div></div>`;
  render();
  setTimeout(() => { const el = document.getElementById(cur ? "gear-value" : "gear-label"); if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 60);
}

async function saveGear(exerciseId, exerciseName, prevId){
  const label = (document.getElementById("gear-label").value || "").trim();
  const value = (document.getElementById("gear-value").value || "").trim();
  if (!label) return toast("Name the setting");
  if (!value) return toast("Say where it goes");

  const id = gearId(exerciseId, label);
  const prev = prevId && S.entries.find(x => x.id === prevId);
  // Renaming the label moves the entry to a new id — retire the old one so the
  // rename doesn't leave a duplicate behind.
  if (prev && prev.id !== id) await saveEntry({...prev, ts:Date.now(), deleted:true});
  const existing = S.entries.find(x => x.id === id);

  S.sheet = null;
  await saveEntry({
    id, ts:Date.now(), created:(prev && prev.created) || (existing && existing.created) || Date.now(),
    type:"gear", exerciseId, exerciseName, label, value, deleted:false
  });
  syncSoon("equipment", 8000);
  render(); toast("Saved");
}

async function deleteGear(id){
  const e = S.entries.find(x => x.id === id);
  if (!e) return;
  S.sheet = null;
  await saveEntry({...e, ts:Date.now(), deleted:true});
  syncSoon("equipment", 8000);
  render(); toast("Removed");
}

/* Adding setup for something that isn't on screen — same exercise list the
   add-exercise sheet uses, so a substitution you've logged before is one tap. */
function sheetGearExercise(){
  const known = [...knownExercises().entries()];
  S.sheet = () => `<div class="mask" onclick="if(event.target===this){S.sheet=null;render()}">
    <div class="sheet">
      <h4>Setup for…</h4>
      <input type="text" id="gear-ex" list="gearexlist" placeholder="Exercise name" autocomplete="off">
      <datalist id="gearexlist">${known.map(([, n]) => `<option value="${esc(n)}">`).join("")}</datalist>
      <button class="btn" onclick="confirmGearExercise()">Next</button>
      <button class="btn ghost slim" onclick="S.sheet=null;render()">Cancel</button>
    </div></div>`;
  render();
  setTimeout(() => document.getElementById("gear-ex")?.focus(), 60);
}

function confirmGearExercise(){
  const name = document.getElementById("gear-ex").value.trim();
  const match = [...knownExercises().entries()].find(([, v]) => v.toLowerCase() === name.toLowerCase());
  const id = match ? match[0] : slugify(name);
  if (!id) return toast("Name the exercise");
  sheetGear(id, match ? match[1] : name);
}

function viewGear(){
  const list = gearList();
  return `<div class="scroll">
    <div class="top">
      <div class="grow">
        <h1>Equipment</h1>
        <div class="sub">Where the hardware goes. Shown on the exercise while you log it.</div>
      </div>
      <button class="chip" onclick="go('settings')">Done</button>
    </div>

    ${list.length ? list.map(g => `
      <h2>${esc(g.name)}</h2>
      <div class="card">
        ${g.items.map(it => `<button class="gset" onclick="sheetGear('${g.id}',${jsArg(g.name)},'${it.id}')">
            <span class="l">${esc(it.label)}</span>
            <span class="v trunc">${esc(it.value)}</span>
          </button>`).join("")}
        <button class="btn ghost slim" onclick="sheetGear('${g.id}',${jsArg(g.name)})">+ Setting</button>
      </div>`).join("")
    : `<div class="card" style="margin-top:18px">
        <div style="font-weight:650">Nothing recorded yet</div>
        <div class="sub">Rack holes, bench angles, seat heights, pin positions — anything you would
        otherwise re-find every week.</div>
      </div>`}

    <button class="btn ghost" onclick="sheetGearExercise()">+ Add for an exercise</button>
    <div class="sub" style="margin:12px 0 0;color:var(--text-3)">
      Settings ride along with the log, so they sync to your other devices like everything else.
    </div>
  </div>`;
}

function quickAdd(id, name){
  const prev = lastPerf(id, S.active.date);
  const n = prev ? prev.sets.length : 3, reps = prev ? prev.sets[0].reps : 10;
  S.active.exercises.push(buildExercise({id, name, A:{sets:n,lo:reps,hi:reps}, B:{sets:n,lo:reps,hi:reps}}, S.active.block, S.active.date));
  S.active.cur = S.active.exercises.length - 1;
  persistActive(); render();
}

/* Inputs are uncontrolled — writing straight to state avoids a re-render
   that would steal focus mid-keystroke. */
function setVal(i, j, k, v){ S.active.exercises[i].sets[j][k] = num(v); S.active.exercises[i].sets[j].suggested = false; persistActive(); }
function bump(i, j, k, d){
  const ex = S.active.exercises[i], st = ex.sets[j];
  const ghost = ex.last && ex.last.sets[j] ? ex.last.sets[j][k] : null;   // adjust from last week, not from zero
  st[k] = Math.max(0, (st[k] ?? ghost ?? 0) + d); st.suggested = false;
  persistActive(); render();
}
function focusEx(i){ S.active.cur = S.active.cur === i ? -1 : i; render(); }
function addSet(i){
  const ex = S.active.exercises[i], lastSet = ex.sets[ex.sets.length-1] || {};
  ex.sets.push({reps:lastSet.reps ?? ex.target.lo, weight:lastSet.weight ?? null, rpe:null, done:false, suggested:false, entryId:null});
  persistActive(); render();
}
/** Cardio fields differ from whatever is on file for this session. */
function cardioDirty(a){
  const c = a.cardio, e = a.cardioId && S.entries.find(x => x.id === a.cardioId && !x.deleted);
  if (!e) return c.durationMin != null || c.distanceKm != null || !!c.notes;
  return c.durationMin !== (e.durationMin ?? null) || c.distanceKm !== distKm(e)
      || c.avgPower !== (e.avgPower ?? null) || c.avgHr !== (e.avgHr ?? null)
      || c.rpe !== (e.rpe ?? null) || (c.notes || "") !== (e.notes || "");
}

function closeSession(){
  const a = S.active;
  const any = a.exercises.some(e => e.sets.some(s => s.done)) || (a.cardio && a.cardio.durationMin != null);
  commitAll();
  if (a.date !== today()){
    // Sets save as they're ticked, so closing loses nothing — except on the
    // cardio screen, where the numbers only land on Save.
    if (a.cardio && cardioDirty(a) && !confirm("Discard the changes to this ride?")) return;
    S.active = null; setMeta("active", null); releaseWake();
    if (any) openDetail(a.date, a.sessionId); else go("history");
    return;
  }
  if (any) { go("today"); toast("Session kept — resume from Today"); }
  else { S.active = null; setMeta("active", null); releaseWake(); go("today"); }
}

/* ---------- Cardio ---------- */
function viewCardio(){
  const a = S.active, c = a.cardio, s = ROUTINE.sessions[a.sessionId];
  const f = (lbl, key, unit, step) => `<div class="frow">
      <label>${lbl}</label>
      <input class="num" type="number" inputmode="decimal" step="${step||1}" value="${c[key] ?? ""}"
             placeholder="—" onfocus="this.select()" oninput="S.active.cardio.${key}=num(this.value);persistActive()">
      <span class="u">${unit}</span></div>`;
  return `<div class="shead">
      <div class="between">
        <div class="grow"><div class="t">${esc(a.sessionName)}</div><div class="s">${esc((s&&s.tag)||"")}</div></div>
        <button class="iconbtn" onclick="closeSession()">${ICON.x}</button>
      </div>
      ${a.date !== today() ? `<div class="editing"><i></i>Logging to ${esc(dayLabelLong(a.date))}</div>` : ""}
    </div>
    <div class="scroll" style="padding-top:16px">
      ${s && s.detail ? `<div class="card" style="color:var(--text-2);font-size:14px">${esc(s.detail)}</div>` : ""}
      <div class="card">
        ${f("Duration","durationMin","min")}
        ${f("Distance","distanceKm","km",.1)}
        ${f("Avg power","avgPower","W")}
        ${f("Avg HR","avgHr","bpm")}
        ${f("RPE","rpe","/10",.5)}
        <textarea class="note" placeholder="Notes" oninput="S.active.cardio.notes=this.value;persistActive()">${esc(c.notes)}</textarea>
      </div>
      <button class="btn" onclick="finishSession()">Save session</button>
    </div>`;
}

/* ==========================================================================
   Earlier days — pick a date, then log a session onto it or open one already
   logged. Nothing here is a separate code path: it hands the date to
   startSession and the normal session screen does the rest.
   ========================================================================== */
const dayLabelLong = d => new Date(d+"T00:00:00").toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"});
const sessionsOn   = date => sessionList().filter(s => s.date === date);
const mobilityOn   = date => !!S.entries.find(e => e.id === "mob-" + date && !e.deleted);

function sheetPickDay(){
  S.sheet = () => `<div class="mask" onclick="if(event.target===this){S.sheet=null;render()}">
    <div class="sheet">
      <h4>Another day</h4>
      <div class="sub" style="margin-bottom:12px">Log a session you missed, or fix one you already logged.</div>
      <input type="date" id="pickdate" max="${today()}" value="${today()}"
             onchange="if(this.value)sheetDay(this.value)">
      <div class="daylist">${lastDays(14).map(dayRow).join("")}</div>
      <button class="btn ghost slim" onclick="S.sheet=null;render()">Cancel</button>
    </div></div>`;
  render();
}

const lastDays = n => Array.from({length:n}, (_, i) => shiftDate(today(), -i));

function dayRow(d){
  const ss = sessionsOn(d), mob = mobilityOn(d);
  const sched = ROUTINE.sessions[ROUTINE.week[new Date(d+"T00:00:00").getDay()]];
  const sum = ss.length
    ? ss.map(s => s.sessionName).join(" · ") + (mob ? " · mobility" : "")
    : mob ? "Mobility only"
    : "Nothing logged" + (sched && sched.kind !== "rest" ? ` · ${sched.name} scheduled` : "");
  const dt = new Date(d+"T00:00:00");
  return `<button class="hitem" onclick="sheetDay('${d}')">
    <div class="dt">
      <div class="d num">${dt.getDate()}</div>
      <div class="m">${dt.toLocaleDateString(undefined,{weekday:"short"})}</div>
    </div>
    <div class="vline"></div>
    <div class="grow">
      <div class="nm trunc">${d === today() ? "Today" : dt.toLocaleDateString(undefined,{month:"short", day:"numeric"})}</div>
      <div class="sm trunc" style="color:${ss.length ? "var(--text-2)" : "var(--text-3)"}">${esc(sum)}</div>
    </div>
    <span style="color:var(--text-3)">${ICON.chev}</span>
  </button>`;
}

/* Recomputed on every render so ticking mobility from inside the sheet shows up. */
function sheetDay(date){
  S.sheet = () => {
    const ss = sessionsOn(date), mob = mobilityOn(date);
    const sid = ROUTINE.week[new Date(date+"T00:00:00").getDay()];
    return `<div class="mask" onclick="if(event.target===this){S.sheet=null;render()}">
      <div class="sheet">
        <h4 class="trunc">${date === today() ? "Today" : esc(dayLabelLong(date))}</h4>
        ${ss.length ? `<h2 style="margin:0 0 9px">Logged</h2>
          ${ss.map(s => `<button class="hitem" onclick="editSession('${s.date}','${s.sessionId}')">
            <div class="grow"><div class="nm trunc">${esc(s.sessionName)}</div>
              <div class="sm">${s.type === "cardio" ? "Ride" : s.entries.filter(e => e.type === "set").length + " sets"} · tap to edit</div></div>
            <span style="color:var(--text-3)">${ICON.chev}</span></button>`).join("")}` : ""}
        <h2 style="margin:${ss.length ? "18px" : "0"} 0 9px">${ss.length ? "Log another" : "Log a session"}</h2>
        <div class="picks">
          ${Object.entries(ROUTINE.sessions).filter(([k,v]) => v.kind !== "rest" && !ss.some(s => s.sessionId === k)).map(([k,v]) =>
            `<button class="pick" onclick="editSession('${date}','${k}')">
               <div class="bar" style="background:${v.kind === "cardio" ? "var(--cyan)" : "var(--lime)"};${k === sid ? "" : "opacity:.35"}"></div>
               <div class="n">${esc(v.name)}</div>
               <div class="d">${k === sid ? "Scheduled that day" : esc(v.tag || "")}</div>
             </button>`).join("")}
        </div>
        <button class="opt ${mob ? "on" : ""}" style="width:100%;margin-top:12px" onclick="toggleMobility('${date}')">
          ${mob ? "✓ Mobility done" : "Mark mobility done"}
        </button>
        <button class="btn ghost slim" onclick="sheetPickDay()">Pick a different day</button>
        <button class="btn ghost slim" onclick="S.sheet=null;render()">Close</button>
      </div></div>`;
  };
  render();
}

async function deleteSession(date, sid){
  const s = sessionList().find(x => x.date === date && x.sessionId === sid);
  if (!s) return;
  if (!confirm(`Delete ${s.sessionName} on ${fmtDay(date)}? Every set and note logged for it goes with it.`)) return;
  // Tombstones, not removals — a delete has to survive the merge on other devices.
  for (const e of s.entries) if (!e.deleted) await saveEntry({...e, deleted:true, ts:Date.now()});
  if (S.active && S.active.date === date && S.active.sessionId === sid){
    S.active = null; await setMeta("active", null); releaseWake();
  }
  S.detail = null; S.view = "history"; render(); toast("Session deleted");
  syncSoon("delete session", 4000);
}

/* ---------- History ---------- */
const fmtW   = w => w == null ? "—" : (w % 1 ? w.toFixed(1) : w);
const fmtDay = d => new Date(d+"T00:00:00").toLocaleDateString(undefined,{month:"short", day:"numeric"});

function hItem(s){
  const isCardio = s.type === "cardio";
  let sm;
  if (isCardio){
    const e = s.entries[0];
    sm = [e.durationMin && e.durationMin+" min", distKm(e) && distKm(e)+" km", e.avgPower && e.avgPower+" W"].filter(Boolean).join(" · ");
  } else {
    const rows = s.entries.filter(e => e.type === "set");
    const ex = new Set(rows.map(e => e.exerciseId));
    const vol = rows.reduce((n,e) => n + (e.reps||0)*(e.weight||0), 0);
    const notes = s.entries.filter(e => e.type === "exnote").length + rows.filter(e => e.notes).length;
    const pl = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
    sm = `${pl(ex.size,"exercise")} · ${pl(rows.length,"set")}${vol ? " · " + Math.round(vol).toLocaleString() + " lb" : ""}${notes ? " · " + pl(notes,"note") : ""}`;
  }
  const dt = new Date(s.date+"T00:00:00");
  return `<button class="hitem" onclick="openDetail('${s.date}','${s.sessionId}')">
    <div class="dt"><div class="d num">${dt.getDate()}</div><div class="m">${dt.toLocaleDateString(undefined,{month:"short"})}</div></div>
    <div class="vline"></div>
    <div class="grow"><div class="nm trunc">${esc(s.sessionName)}</div><div class="sm">${esc(sm)}</div></div>
    <span style="color:var(--text-3)">${ICON.chev}</span>
  </button>`;
}

function viewHistory(){
  if (S.detail) return viewDetail();
  const list = sessionList();
  const byMonth = {};
  list.forEach(s => { const k = new Date(s.date+"T00:00:00").toLocaleDateString(undefined,{month:"long", year:"numeric"}); (byMonth[k] ||= []).push(s); });
  return `<div class="scroll">
    <div class="top">
      <h1>History</h1>
      <button class="chip" onclick="sheetPickDay()" style="color:var(--accent)">+ Earlier day</button>
    </div>
    ${list.length ? Object.entries(byMonth).map(([m, ss]) => `<h2>${m}</h2>${ss.map(hItem).join("")}`).join("")
      : `<div class="empty">Nothing logged yet.<br>Sessions you complete will land here.<br>
           <button class="btn slim" style="max-width:260px;margin:16px auto 0" onclick="sheetPickDay()">Log an earlier day</button>
         </div>`}
  </div>`;
}

function openDetail(date, sid){ S.view = "history"; S.detail = {date, sid}; window.scrollTo(0,0); render(); }

function viewDetail(){
  const s = sessionList().find(x => x.date === S.detail.date && x.sessionId === S.detail.sid);
  if (!s) { S.detail = null; return viewHistory(); }
  const dt = new Date(s.date+"T00:00:00");
  let body;
  if (s.type === "cardio"){
    const e = s.entries[0];
    body = `<div class="det">
      ${[["Duration",e.durationMin,"min"],["Distance",distKm(e),"km"],["Avg power",e.avgPower,"W"],["Avg HR",e.avgHr,"bpm"],["RPE",e.rpe,"/10"]]
        .filter(r => r[1] != null).map(([l,v,u]) => `<div class="frow"><label>${l}</label><div class="num" style="font-weight:650">${v} <span class="dim2" style="font-size:12px">${u}</span></div></div>`).join("")}
      ${e.notes ? `<div style="margin-top:12px;color:var(--text-2);font-size:14px">${esc(e.notes)}</div>` : ""}
    </div>`;
  } else {
    const byEx = new Map();
    [...s.entries].filter(e => e.type === "set").sort((a,b) => a.setIndex - b.setIndex).forEach(e => {
      if (!byEx.has(e.exerciseId)) byEx.set(e.exerciseId, []);
      byEx.get(e.exerciseId).push(e);
    });
    const prs = prIds([...byEx.keys()]);
    body = [...byEx.entries()].map(([exId, rows]) => {
      const n = exNote(s.date, s.sessionId, exId);
      return `<div class="det">
        <div class="nm">${esc(rows[0].exerciseName)}</div>
        ${rows.map(e => `<div class="dset">
          <span class="ix num">${e.setIndex}</span>
          <span class="w num">${fmtW(e.weight)} lb</span><span class="dim">×</span><span class="num">${e.reps}</span>
          ${prs.has(e.id) ? `<span class="prtag">PR</span>` : ""}
          ${e.rpe != null ? `<span class="dim2" style="font-size:12.5px">RPE ${e.rpe}</span>` : ""}
          ${e.notes ? `<span class="dim2" style="font-size:12.5px">· ${esc(e.notes)}</span>` : ""}

        ${n ? `<div class="exnote">${esc(n)}</div>` : ""}
