    <div class="top">
      <div><h1>${esc(s.sessionName)}</h1>
        <p class="sub">${dt.toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"})}${s.entries[0].block ? " · Block " + s.entries[0].block : ""}</p></div>

              onclick="deleteSession('${s.date}','${s.sessionId}')">Delete</button>

}

/* ==========================================================================
   Stats
   ========================================================================== */
function setRange(r){ S.stats.range = r; render(); }
function setStatsExercise(id){ S.stats.exercise = id; render(); }
function toggleGroup(g){ S.stats.group = S.stats.group === g ? null : g; render(); }

function viewStats(){
  const from = rangeStart();
  const weeks = weeksIn(from);                  // capped, for the charts
  const inWin = d => d >= from;

  const sess    = sessionList().filter(s => inWin(s.date));
  const rows    = sets().filter(e => inWin(e.date));
  const strength= sess.filter(s => s.type !== "cardio").length;
  const rides   = sess.filter(s => s.type === "cardio");
  const cardio  = S.entries.filter(e => e.type === "cardio" && !e.deleted && inWin(e.date));
  const rideMin = cardio.reduce((n,e) => n + (e.durationMin || 0), 0);
  const volume  = rows.reduce((n,e) => n + (e.reps||0)*(e.weight||0), 0);

  // Per-week rates divide by the weeks you were actually training. Picking a
  // 6-month window after 3 months of logging shouldn't halve every average.
  const first = S.entries.reduce((m,e) => (!e.deleted && e.date && (!m || e.date < m)) ? e.date : m, null);
  const nw    = Math.max(1, weeksIn(first && first > from ? first : from, 999).length);

  return `<div class="scroll">
    <div class="top"><div><h1>Stats</h1><p class="sub">Last ${RANGES[S.stats.range].label}</p></div></div>

    <div class="seg">
      ${Object.entries(RANGES).map(([k,v]) =>
        `<button class="${S.stats.range===k?"on":""}" onclick="setRange('${k}')">${k === "all" ? "All" : k.toUpperCase()}</button>`).join("")}
    </div>

    ${sess.length || rows.length ? `
      <div class="tiles">
        <div class="tile">
          <div class="k">Sessions</div>
          <div class="v num">${sess.length}</div>
          <div class="s">${(sess.length/nw).toFixed(1)}/week · ${strength} lift, ${rides.length} ride</div>
        </div>
        <div class="tile">
          <div class="k">Sets</div>
          <div class="v num">${rows.length}</div>
          <div class="s">${Math.round(rows.length/nw)}/week</div>
        </div>
        <div class="tile">
          <div class="k">Volume</div>
          <div class="v num">${(volume/1000).toFixed(1)}<u>k lb</u></div>
          <div class="s">${Math.round(volume/nw).toLocaleString()} lb/week</div>
        </div>
        <div class="tile">
          <div class="k">Ride time</div>
          <div class="v num">${(rideMin/60).toFixed(1)}<u>h</u></div>
          <div class="s">${(rideMin/60/nw).toFixed(1)} h/week</div>
        </div>
      </div>

      ${cardHeatmap(weeks[0] || from)}
      ${cardProgression()}
      ${cardVolume(weeks, from)}
      ${cardBests()}
    ` : `<div class="empty">Nothing logged in this window.<br>Finish a session and the numbers show up here.</div>`}
  </div>`;
}

/* ---------- consistency ---------- */
function cardHeatmap(win){
  const day = new Map();
  for (const s of sessionList()){
    const d = day.get(s.date) || {};
    d[s.type === "cardio" ? "c" : "s"] = s.sessionId;
    day.set(s.date, d);
  }
  for (const e of S.entries){
    if (e.type !== "mobility" || e.deleted) continue;
    const d = day.get(e.date) || {}; d.m = true; day.set(e.date, d);
  }

  const start = weekStart(win), end = shiftDate(weekStart(today()), 6), now = today();
  const cells = [];
  let streak = 0, trained = 0;
  for (let d = start; d <= end; d = shiftDate(d, 1)){
    const v = day.get(d) || {};
    const cls = v.s && v.c ? "sc" : v.s ? "s" : v.c ? "c" : v.m ? "m" : "";
    if (d <= now && (v.s || v.c)) trained++;
    const target = v.s || v.c;
    const what = [v.s && "lift", v.c && "ride", v.m && "mobility"].filter(Boolean).join(" + ") || "nothing";
    // A logged day opens the session; an empty past day offers to fill it in.
    const tap = target ? `openDetail('${d}','${target}')` : d <= now ? `sheetDay('${d}')` : "";
    cells.push(`<i class="${cls}${d > now ? " ahead" : ""}" title="${fmtDay(d)} — ${what}"
      ${tap ? `onclick="${tap}"` : ""}></i>`);
  }
  // Consecutive days ending today (or yesterday, if today is still open) with a session.
  let c = now;
  if (!day.get(c) || !(day.get(c).s || day.get(c).c)) c = shiftDate(c, -1);
  while (day.get(c) && (day.get(c).s || day.get(c).c)){ streak++; c = shiftDate(c, -1); }

  const wks = Math.round((new Date(end+"T00:00:00") - new Date(start+"T00:00:00")) / 6048e5);
  return `<div class="card">
    <div class="between" style="margin-bottom:14px">
      <div>
        <div style="font-weight:650">Consistency</div>
        <div class="sub">${trained} training days over ${wks} weeks · ${streak ? streak + " day streak" : "no active streak"}</div>
      </div>
    </div>
    <div class="heatwrap">
      <div class="hlab"><span></span><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span></div>
      <!-- Cells stay square and shrink to fit; the cap stops six columns from
           ballooning into blocks on a phone. -->
      <div class="heat" style="max-width:${cells.length/7*20 + (cells.length/7 - 1)*3}px">${cells.join("")}</div>
    </div>
    <div class="legend">
      <b><i style="background:var(--lime)"></i>Lift</b>
      <b><i style="background:var(--cyan)"></i>Ride</b>
      <b><i style="background:var(--amber);opacity:.5"></i>Mobility only</b>
      <b><i style="background:var(--surface-3)"></i>Nothing</b>
    </div>
  </div>`;
}

/* ---------- progression ---------- */
function cardProgression(){
  const logged = new Map();
  for (const e of sets()) logged.set(e.exerciseId, {name:e.exerciseName, date:e.date});
  if (!logged.size) return "";

  const opts = [...logged.entries()].sort((a,b) => a[1].name.localeCompare(b[1].name));
  let id = S.stats.exercise;
  if (!id || !logged.has(id)){
    // Default to whichever main lift was touched most recently.
    const mains = new Set();
    Object.values(ROUTINE.sessions).forEach(s => (s.exercises||[]).forEach(x => x.main && mains.add(x.id)));
    const pick = [...logged.entries()].filter(([k]) => mains.has(k)).sort((a,b) => b[1].date < a[1].date ? -1 : 1)[0]
              || [...logged.entries()].sort((a,b) => b[1].date < a[1].date ? -1 : 1)[0];
    id = pick[0];
  }

  const series = progression(id);
  const weighted = series.some(p => p.e1 > 0);
  const pts = series.map(p => ({
    x: new Date(p.date+"T00:00:00").getTime(),
    y: weighted ? p.e1 : (p.reps_total || 0),
    p
  }));

  const last = series[series.length - 1], best = bestSet(id);
  let trend = "";
  if (pts.length >= 2){
    const cut = Date.now() - 28*864e5;
    const recent = pts.filter(q => q.x >= cut);
    const base = recent.length >= 2 ? recent : pts.slice(-4);
    const days = (base[base.length-1].x - base[0].x) / 864e5;
    const delta = base[base.length-1].y - base[0].y;
    if (days > 0){
      const perWeek = delta / days * 7;
      const unit = weighted ? " lb/wk" : " reps/wk";
      trend = `<span style="color:${perWeek > 0.05 ? "var(--accent)" : perWeek < -0.05 ? "var(--amber)" : "var(--text-2)"}">
        ${perWeek > 0 ? "+" : ""}${perWeek.toFixed(1)}${unit}</span> <span class="dim2">over the last ${Math.round(days)} days</span>`;
    }
  }

  return `<div class="card">
    <div style="font-weight:650;margin-bottom:12px">Progression</div>
    <select class="sel" onchange="setStatsExercise(this.value)">
      ${opts.map(([k,v]) => `<option value="${esc(k)}" ${k===id?"selected":""}>${esc(v.name)}</option>`).join("")}
    </select>
    <div class="chartwrap" style="margin-top:14px">
      ${lineChart(pts, weighted)}
    </div>
    <div class="between" style="margin-top:14px;border-top:1px solid var(--line-soft);padding-top:13px;flex-wrap:wrap;gap:14px">
      <div>
        <div class="k" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)">Best</div>
        <div class="num" style="font-weight:650;margin-top:4px">${best
          ? `${fmtW(best.e.weight)} × ${best.e.reps} <span class="dim2" style="font-size:12.5px">· e1RM ${Math.round(best.v)} lb</span>`
          : "—"}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)">Last</div>
        <div class="num" style="font-weight:650;margin-top:4px">${last
          ? (weighted ? `${fmtW(last.weight)} × ${last.reps}` : `${last.reps_total} reps`) + ` <span class="dim2" style="font-size:12.5px">· ${fmtDay(last.date)}</span>`
          : "—"}</div>
      </div>
    </div>
    ${trend ? `<div class="foot" style="font-size:13px">${trend}</div>` : ""}
    ${weighted ? `<div class="foot">Charting estimated 1RM (Epley) so heavy-low and light-high sessions compare on one axis.</div>`
               : `<div class="foot">Bodyweight lift — charting total reps per session.</div>`}
  </div>`;
}

/* Uniformly-scaled SVG: viewBox does the layout, CSS does the width. */
function lineChart(pts, weighted){
  if (pts.length < 2)
    return `<div class="empty" style="padding:30px 12px">Log this one twice and the trend shows up here.</div>`;

  const W = 320, H = 118, PL = 4, PR = 4, PT = 12, PB = 8;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const span = (y1 - y0) || Math.max(1, y1 * 0.1);
  const lo = y0 - span * 0.35, hi = y1 + span * 0.35;
  const X = v => PL + (x1 === x0 ? 0.5 : (v - x0)/(x1 - x0)) * (W - PL - PR);
  const Y = v => PT + (1 - (v - lo)/((hi - lo) || 1)) * (H - PT - PB);

  const d = pts.map((p,i) => `${i ? "L" : "M"}${X(p.x).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(" ");
  const area = `${d} L${X(x1).toFixed(1)} ${H - PB} L${X(x0).toFixed(1)} ${H - PB} Z`;
  const dots = pts.map((p,i) => {
    const lastOne = i === pts.length - 1;
    return `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${lastOne ? 3.4 : 2}"
      fill="${lastOne ? "var(--accent)" : "var(--bg)"}" stroke="var(--accent)" stroke-width="1.4"
      vector-effect="non-scaling-stroke"><title>${fmtDay(p.p.date)} — ${weighted
        ? `${fmtW(p.p.weight)}×${p.p.reps} (e1RM ${Math.round(p.p.e1)})` : `${p.p.reps_total} reps`}</title></circle>`;
  }).join("");

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;overflow:visible">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity=".22"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#lg)"/>
      <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      ${dots}
    </svg>
    <div class="between" style="margin-top:7px;font-size:11px;color:var(--text-3)">
      <span>${fmtDay(pts[0].p.date)}</span>
      <span class="num">${Math.round(y0)} – ${Math.round(y1)}${weighted ? " lb" : " reps"}</span>
      <span>${fmtDay(pts[pts.length-1].p.date)}</span>
    </div>`;
}

/* ---------- volume ---------- */
function cardVolume(weeks, from){
  const win = weeks[0] || today();
  const rows = sets().filter(e => e.date >= win);
  if (!rows.length) return "";

  const byGroup = new Map();
  for (const e of rows){
    const g = groupOf(e.exerciseId, e.exerciseName);
    byGroup.set(g, (byGroup.get(g) || 0) + 1);
  }
  const sel = S.stats.group;
  const capped = win > from;                       // range runs deeper than the chart shows
  const first = S.entries.reduce((m,e) => (!e.deleted && e.date && (!m || e.date < m)) ? e.date : m, null);
  const nw = Math.max(1, weeksIn(first && first > win ? first : win, 999).length);

  const perWeek = weeks.map(w => {
    const end = shiftDate(w, 6);
    const n = rows.filter(e => e.date >= w && e.date <= end &&
      (!sel || groupOf(e.exerciseId, e.exerciseName) === sel)).length;
    return {week:w, n};
  });
  const peak = Math.max(1, ...perWeek.map(x => x.n));
  const cur  = weekStart(today());

  const ordered = Object.keys(GROUPS).filter(g => byGroup.get(g)).sort((a,b) => byGroup.get(b) - byGroup.get(a));
  const top = Math.max(...ordered.map(g => byGroup.get(g)));

  return `<div class="card">
    <div class="between" style="margin-bottom:4px">
      <div>
        <div style="font-weight:650">Weekly sets${sel ? ` · ${GROUPS[sel]}` : ""}</div>
        ${capped ? `<div class="sub">Last ${weeks.length} weeks</div>` : ""}
      </div>
      <div class="dim2" style="font-size:12.5px">peak ${peak}</div>
    </div>
    <div class="cols">
      ${perWeek.map(x => `<div class="col ${x.week === cur ? "now" : ""}"
        title="Week of ${fmtDay(x.week)} — ${x.n} sets${x.week === cur ? " so far" : ""}">
        <i style="height:${x.n/peak*100}%;background:${sel ? GROUP_COLOR[sel] : "var(--accent)"}"></i></div>`).join("")}
    </div>
    <div class="xax">
      ${perWeek.map((x,i) => `<span>${i === 0 || i === perWeek.length-1 || perWeek.length <= 8 || i % Math.ceil(perWeek.length/6) === 0
        ? new Date(x.week+"T00:00:00").toLocaleDateString(undefined,{month:"numeric",day:"numeric"}) : ""}</span>`).join("")}
    </div>

    <div style="margin-top:20px;border-top:1px solid var(--line-soft);padding-top:6px">
      ${ordered.map(g => {
        const n = byGroup.get(g);
        return `<button class="gbar ${sel && sel !== g ? "dim3" : ""}" onclick="toggleGroup('${g}')">
          <span class="gn">${GROUPS[g]}</span>
          <span class="gt"><i style="width:${n/top*100}%;background:${GROUP_COLOR[g]}"></i></span>
          <span class="gv num">${(n/nw).toFixed(1)}<u> /wk</u></span>
        </button>`;
      }).join("")}
    </div>
    <div class="foot">
      ${sel ? "Tap the group again to see every set." : "Tap a group to filter the weekly chart."}
      The last bar is the week in progress. One logged set counts once, whether or not it was per side.
    </div>
  </div>`;
}

/* ---------- personal bests ---------- */
function cardBests(){
  const ids = new Set(sets().map(e => e.exerciseId));
  const best = [...ids].map(id => ({id, b:bestSet(id)})).filter(x => x.b)
    .sort((a,b) => b.b.v - a.b.v).slice(0, 8);
  if (!best.length) return "";
  return `<div class="card">
    <div style="font-weight:650;margin-bottom:6px">Personal bests</div>
    <div class="sub" style="margin-bottom:8px">Heaviest estimated 1RM per lift, all time.</div>
    ${best.map(({id, b}) => `<button class="pb" style="width:100%;text-align:left" onclick="setStatsExercise('${esc(id)}');window.scrollTo(0,0)">
      <span class="n">${esc(b.e.exerciseName)}</span>
      <span class="num" style="font-weight:650">${fmtW(b.e.weight)} × ${b.e.reps}</span>
      <span class="dim2 num" style="font-size:12.5px;width:64px;text-align:right">${Math.round(b.v)} lb</span>
    </button>`).join("")}
  </div>`;
}

/* ---------- Settings ---------- */
function viewSettings(){
  const b = blockInfo(), n = sets().length;
  const rest = REST[b.block];
  return `<div class="scroll">

}

function viewSync(){
  const c = Sync.cfg, st = Sync.state;
  if (!Sync.on){
    return `<div class="card">
      <div class="sub" style="margin-bottom:14px">
        Point this at a <b>private</b> repo holding <b>log.json</b>. Every device that connects
        to it stays in step. Your token is stored on this device only.
      </div>
      <div class="frow"><label>Owner</label><input id="sy-owner" type="text" placeholder="reynoldsjon-eng" value="${esc((c&&c.owner)||"reynoldsjon-eng")}" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div class="frow"><label>Repo</label><input id="sy-repo" type="text" placeholder="workout-data" value="${esc((c&&c.repo)||"workout-data")}" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div class="frow"><label>Token</label><input id="sy-token" type="password" placeholder="github_pat_..." autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <button class="btn" onclick="connectSync()">Connect</button>
      <div class="sub" style="margin-top:14px;color:var(--text-3)">
        Make a <b>fine-grained</b> token on GitHub: Settings → Developer settings → Personal access
        tokens → Fine-grained. Give it access to only that one repo, with
        <b>Repository permissions → Contents: Read and write</b>.
      </div>
    </div>`;
  }
  const when = st.last ? new Date(st.last).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}) : "—";
  const status = st.busy ? ["Syncing…","var(--text-2)"]
    : st.error ? [st.error,"var(--red)"]
    : st.pending ? ["Changes waiting to upload","var(--amber)"]
    : [`Up to date · ${when}`,"var(--accent)"];
  return `<div class="card">
    <div class="between" style="padding-bottom:12px">
      <span class="dim trunc">${esc(c.owner)}/${esc(c.repo)}</span>
      <span class="dim2" style="font-size:12.5px">${esc(c.path)}</span>
    </div>
    <div style="border-top:1px solid var(--line-soft);padding-top:12px;color:${status[1]};font-size:14px;font-weight:600">
      ${esc(status[0])}
    </div>
    <button class="btn slim" onclick="Sync.run('manual')" ${st.busy?"disabled":""}>Sync now</button>
    <button class="btn ghost slim" onclick="disconnectSync()">Disconnect</button>
  </div>`;
}

async function connectSync(){
  const owner = document.getElementById("sy-owner").value.trim();
  const repo  = document.getElementById("sy-repo").value.trim();
  const token = document.getElementById("sy-token").value.trim();
  if (!owner || !repo || !token) return toast("Fill in all three");

  Sync.cfg = {owner, repo, token, path:"log.json", branch:"main"};
  const r = await Sync.api(`/repos/${owner}/${repo}`);
  if (!r.ok){ const m = await Sync.err(r); Sync.cfg = null; render(); return toast(m); }
  const info = await r.json();
  if (!info.private && !confirm("That repo is PUBLIC — your training log would be visible to anyone. Connect anyway?")){
    Sync.cfg = null; render(); return;
  }
  Sync.cfg = {owner, repo, token, path:"log.json", branch:info.default_branch || "main"};
  toast("Connected"); render();
  await Sync.run("first sync");
}

function disconnectSync(){
  if (!confirm("Disconnect sync? Your logs stay on this device; the token is forgotten.")) return;
  Sync.cfg = null; Sync.state = {busy:false, last:null, error:null, pending:false};
  render(); toast("Disconnected");
}

async function setBlock(x, restart){
  const cur = S.meta.block || {block:"A", start:today()};
  await setMeta("block", {block:x, start:(restart || x !== cur.block) ? today() : cur.start});
  render(); toast(`Block ${x}`);
}

/* ---------- Add-exercise sheet ---------- */
function sheetAddExercise(){
  const known = [...knownExercises().entries()];
  S.sheet = () => `<div class="mask" onclick="if(event.target===this){S.sheet=null;render()}">
    <div class="sheet">
      <h4>Add exercise</h4>
      <input type="text" id="exname" list="exlist" placeholder="Exercise name" autocomplete="off">
      <datalist id="exlist">${known.map(([id,n]) => `<option value="${esc(n)}">`).join("")}</datalist>
      <div class="row" style="gap:10px;margin-top:12px">
        <div class="fld"><button onclick="stepIn('exsets',-1)">−</button>
          <input class="v num" id="exsets" type="number" inputmode="numeric" value="3"><button onclick="stepIn('exsets',1)">+</button><span class="u">sets</span></div>
        <div class="fld"><button onclick="stepIn('exreps',-1)">−</button>
          <input class="v num" id="exreps" type="number" inputmode="numeric" value="10"><button onclick="stepIn('exreps',1)">+</button><span class="u">reps</span></div>
      </div>
      <button class="btn" onclick="confirmAddExercise()">Add</button>
      <button class="btn ghost slim" onclick="S.sheet=null;render()">Cancel</button>
    </div></div>`;
  render();
  setTimeout(() => document.getElementById("exname")?.focus(), 60);
}
function stepIn(id, d){ const el = document.getElementById(id); el.value = Math.max(1, (+el.value||0) + d); }

function confirmAddExercise(){
  const name = document.getElementById("exname").value.trim();
  if (!name) return toast("Name the exercise");
  const n = Math.max(1, +document.getElementById("exsets").value || 3);
  const reps = Math.max(1, +document.getElementById("exreps").value || 10);
  const match = [...knownExercises().entries()].find(([, v]) => v.toLowerCase() === name.toLowerCase());
  const id = match ? match[0] : name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const ex = {id, name:match ? match[1] : name, A:{sets:n,lo:reps,hi:reps}, B:{sets:n,lo:reps,hi:reps}};
  S.active.exercises.push(buildExercise(ex, S.active.block, S.active.date));
  S.active.cur = S.active.exercises.length - 1;
  S.sheet = null; persistActive(); render();
}

/* ---------- import / export ---------- */
function exportJSON(){
  const blob = new Blob([JSON.stringify({schema:1, updated:new Date().toISOString(), entries:S.entries}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "log.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function importJSON(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try{
      const data = JSON.parse(await f.text());
      const incoming = Array.isArray(data) ? data : data.entries || [];
      const mine = new Map(S.entries.map(e => [e.id, e]));
      let added = 0;
      for (const e of mergeEntries(S.entries, incoming)){
        const cur = mine.get(e.id);
        if (!cur || (e.ts || 0) > (cur.ts || 0)) { await saveEntry(e); if (!cur) added++; }
      }
      render(); toast(`Imported ${added} new entries`);
      Sync.run("after import");
    }catch(err){ toast("Could not read that file"); }
  };
  inp.click();
}

/* Offline shell. Only registers on a real origin — file:// has no SW support,
   and calling it there throws. */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

(async function boot(){
  try{
    await DB.open();
    S.entries = await DB.all("entries");
    (await DB.all("meta")).forEach(m => S.meta[m.k] = m.v);

    S.rest = S.meta.rest || null;
    if (S.rest && restLeft() < -30) { S.rest = null; setMeta("rest", null); }

    // A backfill in progress is worth keeping across a reload, but only while
    // it's still plausibly the same piece of work.
    const a = S.meta.active;
    if (a && a.date === today()) { S.active = a; reqWake(); }
    else if (a && a.date >= shiftDate(today(), -14)) S.active = a;
    else if (a) setMeta("active", null);

    Sync.state.last = S.meta.lastSync || null;
    render();
    // After sync, not before: a device that already has the real set — deletes
    // included — must not have the starting set written back over it.
    Sync.run("launch").then(seedGear, seedGear);
  }catch(err){
    // Never fail to a black screen — say what broke.
    document.getElementById("app").innerHTML = `<div class="scroll">
      <div class="top"><h1>Can't start</h1></div>
      <div class="card" style="margin-top:16px;border-color:var(--red)">
        <div style="font-weight:650;margin-bottom:8px">Storage is unavailable here</div>
        <div class="sub">${esc(err && err.message || String(err))}</div>
        <div class="sub" style="margin-top:12px">
          This usually means the page was opened straight from a file rather than served
          over http(s). Open it from the hosted URL instead.
        </div>
      </div></div>`;
  }
})();
